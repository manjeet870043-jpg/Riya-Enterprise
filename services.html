<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Services – Riya Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
  color:#fff;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:#020617;
}

nav a{
  color:#9bbcff;
  margin-left:20px;
  text-decoration:none;
}

nav a:hover{
  color:#00c6ff;
}

.section{
  max-width:1100px;
  margin:80px auto;
  text-align:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
  margin-top:50px;
}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:30px;
  transition:0.4s;
}

.card:hover{
  transform:translateY(-10px);
}

.pricing{
  margin-top:80px;
}

.price-box{
  margin-top:20px;
}

.price-box button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#00c6ff;
  color:white;
  cursor:pointer;
}

/* POPUP */
.payment-box{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.payment-content{
  background:#020617;
  padding:30px;
  border-radius:20px;
}

.payment-content img{
  width:200px;
  margin:20px 0;
}

footer{
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<nav>
  <div><b>Riya Enterprise</b></div>
  <div>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="section">

<h1>Our Services</h1>

<div class="cards">
  <div class="card"><h3>Instagram Growth</h3></div>
  <div class="card"><h3>Telegram Promotion</h3></div>
  <div class="card"><h3>Social Media Marketing</h3></div>
  <div class="card"><h3>Paid Campaigns</h3></div>
</div>

<!-- PRICING -->
<div class="pricing">
  <h2>Service Pricing</h2>
  <h3>₹499 / Service</h3>
  <button onclick="showPayment()">Pay Now</button>
</div>

</section>

<!-- POPUP (ONLY ON CLICK) -->
<div id="paymentBox" class="payment-box">

  <span class="close-btn" onclick="closePayment()">✖</span>

  <div class="payment-content">

    <h2>Complete Payment</h2>

    <img src="qr.png">

    <p>Scan & Pay ₹499</p>

    <input type="file">

    <button onclick="verifyPayment()">Verify Payment</button>

    <p id="msg"></p>

  </div>
</div>

<footer>
© 2025 Riya Enterprise
</footer>

<script>
function showPayment(){
  document.getElementById("paymentBox").style.display = "flex";
}

function closePayment(){
  document.getElementById("paymentBox").style.display = "none";
}

function verifyPayment(){
  document.getElementById("msg").innerHTML =
  "Send screenshot to Telegram: @riya4363";
}
</script>

</body>
</html>
